name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nx:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Invariant map
        run: node tools/check-invariant-map.mjs
      - name: Boundary rules are live (deliberate forbidden import must fail lint)
        run: |
          cp apps/risk-authorizer/src/main.ts /tmp/main.bak
          printf "import * as r from 'react';\nconsole.log(r);\n" >> apps/risk-authorizer/src/main.ts
          if pnpm nx lint @sol-agent-trader/risk-authorizer --skip-nx-cache >/tmp/lint.log 2>&1; then
            echo "::error::boundary lint did not reject a banned import in risk-authorizer"; cat /tmp/lint.log; exit 1
          fi
          grep -q 'enforce-module-boundaries' /tmp/lint.log || { echo "::error::lint failed for a different reason"; cat /tmp/lint.log; exit 1; }
          cp /tmp/main.bak apps/risk-authorizer/src/main.ts
      - name: Clock discipline is live (Date.now in strategy code must fail lint)
        run: |
          cp libs/strategies/src/lib/strategies.ts /tmp/strat.bak
          printf "\nexport const leak = () => Date.now();\n" >> libs/strategies/src/lib/strategies.ts
          if pnpm nx lint @sol-agent-trader/strategies --skip-nx-cache >/tmp/lint2.log 2>&1; then
            echo "::error::lint did not reject Date.now() in libs/strategies"; cat /tmp/lint2.log; exit 1
          fi
          grep -q 'no-restricted-properties' /tmp/lint2.log || { echo "::error::lint failed for a different reason"; cat /tmp/lint2.log; exit 1; }
          cp /tmp/strat.bak libs/strategies/src/lib/strategies.ts
      - name: Contract-set lock matches the compiled contracts
        run: pnpm nx test @sol-agent-trader/contracts --skip-nx-cache
      - name: Nx targets
        run: pnpm nx run-many -t lint typecheck test build --parallel=3 --output-style=static
      - name: Built bundles carry no banned package and are self-contained (GUARDRAILS Part 4, D50)
        run: node tools/check-artifacts.mjs
      - name: Artifact scan is live (planted markers must fail, each for the right reason)
        run: |
          set -euo pipefail
          plant() { # $1 = label, $2 = text to append, $3 = expected substring in the report
            cp apps/risk-authorizer/dist/main.js /tmp/planted.js
            printf '%s\n' "$2" >> /tmp/planted.js
            if node tools/check-artifacts.mjs --file /tmp/planted.js --policy risk-authorizer >/tmp/scan.log 2>&1; then
              echo "::error::artifact scan did not reject planted $1"; cat /tmp/scan.log; exit 1
            fi
            grep -qF -- "$3" /tmp/scan.log || { echo "::error::scan rejected planted $1 for a different reason"; cat /tmp/scan.log; exit 1; }
          }
          plant "pnpm path comment (openai)"      '// node_modules/.pnpm/openai@5.0.0/node_modules/openai/index.js' '"pattern": "openai"'
          plant "require of an LLM SDK"           'var p = require("@anthropic-ai/sdk");'                        '"pattern": "@anthropic-ai/*"'
          plant "exact provider client name"      '// node_modules/lunarcrush/index.js'                          '"pattern": "lunarcrush*"'
          plant "package outside the allowlist"   '// node_modules/.pnpm/left-pad@1.3.0/node_modules/left-pad/index.js' '"notAllowlisted"'
          plant "dynamic require"                 'var q = require(someVariable);'                               '"dynamicRequires"'
          # A blind scan must fail, not pass: strip the module-path comments and expect the canary to trip.
          sed '/^\/\/ /d' apps/risk-authorizer/dist/main.js > /tmp/blind.js
          if node tools/check-artifacts.mjs --file /tmp/blind.js --policy risk-authorizer >/tmp/scan.log 2>&1; then
            echo "::error::artifact scan passed a bundle without module-path comments"; cat /tmp/scan.log; exit 1
          fi
          grep -q '"canary"' /tmp/scan.log || { echo "::error::blind bundle rejected for a different reason"; cat /tmp/scan.log; exit 1; }
      - name: Bundles run standalone and report the locked contract digest (D50)
        run: |
          set -euo pipefail
          locked=$(node -e 'console.log(require("./libs/contracts/contract-set.lock.json").digest)')
          for s in worker risk-authorizer execution-service; do
            mkdir -p /tmp/standalone-$s && cp apps/$s/dist/main.js /tmp/standalone-$s/main.js
            (cd /tmp/standalone-$s && node main.js --print-digest > startup.log)
            reported=$(node tools/startup-digest.mjs /tmp/standalone-$s/startup.log)
            echo "$s reports $reported"
            test "$reported" = "$locked" || { echo "::error::$s bundle reports $reported, lock is $locked"; exit 1; }
          done
      - name: Services refuse a credential outside their trust class and never echo its value (§26.1, Part 4)
        run: |
          set -euo pipefail
          check() { # $1 = service, $2 = forbidden variable, $3 = expected message fragment
            set +e
            (cd /tmp/standalone-$1 && env -i PATH="$PATH" DEPLOYMENT_PROFILE=P0 SOLANA_CLUSTER=devnet "$2=plantedsecretvalue0001" node main.js > env.log 2>&1)
            code=$?
            set -e
            test "$code" = "1" || { echo "::error::$1 did not exit 1 with $2 set (exit $code)"; cat /tmp/standalone-$1/env.log; exit 1; }
            grep -q '"event":"env_invalid"' /tmp/standalone-$1/env.log || { echo "::error::$1: no env_invalid report"; cat /tmp/standalone-$1/env.log; exit 1; }
            grep -qF -- "$3" /tmp/standalone-$1/env.log || { echo "::error::$1: refusal did not name $2"; cat /tmp/standalone-$1/env.log; exit 1; }
            if grep -q plantedsecretvalue0001 /tmp/standalone-$1/env.log; then echo "::error::$1 echoed a credential value"; exit 1; fi
          }
          check worker            TURNKEY_API_PRIVATE_KEY      'worker must never hold TURNKEY_API_PRIVATE_KEY'
          check risk-authorizer   SUPABASE_SERVICE_ROLE_KEY    'risk-authorizer must never hold SUPABASE_SERVICE_ROLE_KEY'
          check execution-service RISK_AUTHORIZATION_KEY_PKCS8 'execution-service must never hold RISK_AUTHORIZATION_KEY_PKCS8'

  database:
    name: schema migrations · pgTAP · generated types in sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies every migration)
        run: pnpm exec supabase start -x studio,imgproxy,inbucket,mailpit,logflare,vector,edge-runtime
      - name: pgTAP tests
        run: pnpm exec supabase test db
      - name: libs/db integration tests (pgmq processing, leases) against the local database
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
          NX_DAEMON: 'false'
        run: pnpm nx test @sol-agent-trader/db --skip-nx-cache
      - name: Generated database types match the migrations
        run: |
          pnpm exec supabase gen types typescript --local --schema core,market,intelligence,signals,agents,trading,risk,research,ops,audit,enums > /tmp/database.types.ts
          diff -u libs/db/src/database.types.ts /tmp/database.types.ts || { echo "::error::libs/db/src/database.types.ts is stale; regenerate with supabase gen types"; exit 1; }
      - if: always()
        run: pnpm exec supabase stop --no-backup
