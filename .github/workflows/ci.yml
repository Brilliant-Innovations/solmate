name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nx:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Invariant map
        run: node tools/check-invariant-map.mjs
      - name: Boundary rules are live (deliberate forbidden import must fail lint)
        run: |
          cp apps/risk-authorizer/src/main.ts /tmp/main.bak
          printf "import * as r from 'react';\nconsole.log(r);\n" >> apps/risk-authorizer/src/main.ts
          if pnpm nx lint @sol-agent-trader/risk-authorizer --skip-nx-cache >/tmp/lint.log 2>&1; then
            echo "::error::boundary lint did not reject a banned import in risk-authorizer"; cat /tmp/lint.log; exit 1
          fi
          grep -q 'enforce-module-boundaries' /tmp/lint.log || { echo "::error::lint failed for a different reason"; cat /tmp/lint.log; exit 1; }
          cp /tmp/main.bak apps/risk-authorizer/src/main.ts
      - name: Clock discipline is live (Date.now in strategy code must fail lint)
        run: |
          cp libs/strategies/src/lib/strategies.ts /tmp/strat.bak
          printf "\nexport const leak = () => Date.now();\n" >> libs/strategies/src/lib/strategies.ts
          if pnpm nx lint @sol-agent-trader/strategies --skip-nx-cache >/tmp/lint2.log 2>&1; then
            echo "::error::lint did not reject Date.now() in libs/strategies"; cat /tmp/lint2.log; exit 1
          fi
          grep -q 'no-restricted-properties' /tmp/lint2.log || { echo "::error::lint failed for a different reason"; cat /tmp/lint2.log; exit 1; }
          cp /tmp/strat.bak libs/strategies/src/lib/strategies.ts
      - name: Contract-set lock matches the compiled contracts
        run: pnpm nx test @sol-agent-trader/contracts --skip-nx-cache
      - name: Nx targets
        run: pnpm nx run-many -t lint typecheck test build --parallel=3 --output-style=static
      - name: Built bundles carry no banned package and are self-contained (GUARDRAILS Part 4, D50)
        run: node tools/check-artifacts.mjs
      - name: Artifact scan is live (a planted LLM SDK marker must fail)
        run: |
          cp apps/risk-authorizer/dist/main.js /tmp/planted.js
          printf '\n// node_modules/.pnpm/openai@5.0.0/node_modules/openai/index.js\nvar planted = 1;\n' >> /tmp/planted.js
          if node tools/check-artifacts.mjs --file /tmp/planted.js --policy risk-authorizer >/tmp/scan.log 2>&1; then
            echo "::error::artifact scan did not reject a planted openai marker"; cat /tmp/scan.log; exit 1
          fi
          grep -q '"pattern": "openai"' /tmp/scan.log || { echo "::error::scan failed for a different reason"; cat /tmp/scan.log; exit 1; }
      - name: Bundles run standalone and report the locked contract digest (D50)
        run: |
          set -euo pipefail
          locked=$(node -e 'console.log(require("./libs/contracts/contract-set.lock.json").digest)')
          for s in worker risk-authorizer execution-service; do
            mkdir -p /tmp/standalone-$s && cp apps/$s/dist/main.js /tmp/standalone-$s/main.js
            (cd /tmp/standalone-$s && DEPLOYMENT_PROFILE=P0 node main.js > startup.log)
            reported=$(node tools/startup-digest.mjs /tmp/standalone-$s/startup.log)
            echo "$s reports $reported"
            test "$reported" = "$locked" || { echo "::error::$s bundle reports $reported, lock is $locked"; exit 1; }
          done

  database:
    name: schema migrations · pgTAP · generated types in sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies every migration)
        run: pnpm exec supabase start -x studio,imgproxy,inbucket,mailpit,logflare,vector,edge-runtime
      - name: pgTAP tests
        run: pnpm exec supabase test db
      - name: libs/db integration tests (pgmq processing, leases) against the local database
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
          NX_DAEMON: 'false'
        run: pnpm nx test @sol-agent-trader/db --skip-nx-cache
      - name: Generated database types match the migrations
        run: |
          pnpm exec supabase gen types typescript --local --schema core,market,intelligence,signals,agents,trading,risk,research,ops,audit,enums > /tmp/database.types.ts
          diff -u libs/db/src/database.types.ts /tmp/database.types.ts || { echo "::error::libs/db/src/database.types.ts is stale; regenerate with supabase gen types"; exit 1; }
      - if: always()
        run: pnpm exec supabase stop --no-backup
