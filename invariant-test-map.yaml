# Invariant test map — blueprint §24.6
#
# Every critical invariant has a stable id, the modules that own it, the executable
# property/adversarial tests that prove it, and a status.
#
# status: unmapped  -> no test yet. Allowed only while none of the owner_modules exists on disk.
# status: mapped    -> every path in `tests` exists and runs in CI.
# status: waived    -> never valid for a §24.6 invariant; the checker rejects it.
#
# Checker: node tools/check-invariant-map.mjs  (execution plan ground rule 2)
# Paths are repository-relative. owner_modules are the planned Nx projects from blueprint §4.1.

version: 1
invariants:
