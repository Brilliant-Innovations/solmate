# Invariant test map — blueprint §24.6
#
# Every critical invariant has a stable id, the source modules that own it, the executable
# property/adversarial tests that prove it, and a status.
#
# owner_modules are SPECIFIC source paths (file or directory), not whole projects. A module
# "exists" the moment that path exists. Creating one of these paths in a session obliges that
# session to map an executable test for the invariant (execution plan ground rule 2).
#
# status: unmapped  -> no test yet. Allowed only while none of the owner_modules exists.
# status: mapped    -> every path in `tests` exists and runs in CI.
# status: waived    -> never valid for a §24.6 invariant; the checker rejects it.
#
# Checker: node tools/check-invariant-map.mjs

