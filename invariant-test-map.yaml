  - id: INV-25
    statement: "Normal autonomous signing cannot bypass the external signer-side policy layer."
    required_by: M3
    applicable_profiles:
      - P2
      - P3
      - P4
    applicable_strategy_classes:
      - ALL
    applicable_capabilities:
